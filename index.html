<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Memory Match</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css"/>

</head>
<body>
  <div class="container">
  
    <div class="game-column">
      <div class="game" id="game-board"></div>
    </div>
    <div class="fact-column">
      <div id="fact-box">
        <div id="fact-title">Pokémon Match</div>
        <div id="fact-text">Reveal two of the same Pokémon under the tiles and receive a Pokémon fact!</div>
      </div>
      <button id="restart-btn" onclick="restartGame()">Play Again</button>
    </div>
  </div>

  <script src="./script.js"></script>
</body>
</html>
